<!doctype html>
<!--
  Page de test locale de l'intégration en iframe — exclue du build et du
  déploiement (.vercelignore). Elle imite le site KS Développement qui ouvre
  la démonstration en plein écran.

  1. Lancer la démonstration sur le port 3001 :
       DEMO_MODE=true npm run dev -- -p 3001
     (ou, pour tester la vraie CSP `frame-ancestors`, un build de production :
       DEMO_MODE=true npm run build && DEMO_MODE=true npm start -- -p 3001)
  2. Servir cette page depuis http://localhost:3000, l'origine autorisée par
     défaut — par exemple : python -m http.server 3000
  3. Ouvrir http://localhost:3000/embed-test.html

  Ouverte directement en file://, la page fonctionne avec `next dev` (pas de
  CSP en développement) mais sera refusée par un build de production :
  c'est le comportement attendu, l'origine `null` n'est pas autorisée.

  Paramètres : ?src=<url de la démo> pour viser une autre instance.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Test d'intégration — KS Plastico Demo</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --fg: #0b1624;
        --muted: #5b6878;
        --line: #d9dee5;
        --accent: #2f91ff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }
      header strong { font-weight: 800; letter-spacing: 0.02em; }
      header span { color: var(--muted); }
      .widths { margin-left: auto; display: flex; gap: 6px; }
      button {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 6px;
        padding: 4px 10px;
        font: inherit;
        cursor: pointer;
      }
      button[aria-pressed='true'] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
      main { flex: 1; display: flex; justify-content: center; min-height: 0; padding: 0; }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
        box-shadow: 0 0 0 1px var(--line);
      }
    </style>
  </head>
  <body>
    <header>
      <strong>KS Développement</strong>
      <span>Nos applications › Pilotage d'usine — démonstration intégrée</span>
      <div class="widths" role="group" aria-label="Largeur du cadre">
        <button type="button" data-width="1024px">1024 px</button>
        <button type="button" data-width="1280px">1280 px</button>
        <button type="button" data-width="100%" aria-pressed="true">Pleine largeur</button>
      </div>
    </header>
    <main>
      <iframe
        id="demo"
        title="Démonstration KS Plastico"
        allow="clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const frame = document.getElementById('demo');
      frame.src = params.get('src') || 'http://localhost:3001/demo?embed=1';

      for (const button of document.querySelectorAll('[data-width]')) {
        button.addEventListener('click', () => {
          frame.style.width = button.dataset.width;
          for (const other of document.querySelectorAll('[data-width]')) {
            other.setAttribute('aria-pressed', String(other === button));
          }
        });
      }
    </script>
  </body>
</html>
